<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LIORIN · Hero Transition</title>
  <meta name="description" content="顺天 LIORIN Hero 入场动画独立原型" />
  <meta name="theme-color" content="#000000" />

  <style>
    /* =========================================
       Design Tokens (Dark · 古铜金)
       ========================================= */
    :root {
      --bg:           #000000;
      --surface:      #141210;
      --text:         #e8e2d4;
      --text-muted:   #8a8279;
      --border:       #2a2622;
      --gold:         #e0b078;
      --gold-soft:    #c9a578;
      --gold-glow:    rgba(224, 176, 120, 0.28);
      --yang:         #e8e2d4;
      --yang-dim:     #6a6258;

      --font-display: "Noto Serif SC", "Source Han Serif", Georgia, serif;
      --font-body:    "Inter", "Noto Sans SC", system-ui, sans-serif;
      --font-mono:    "JetBrains Mono", "SF Mono", monospace;

      /* 流式尺寸（mobile-first） */
      --stage-max:    420px;
      --hero-size:    240px;          /* mobile */
      --hero-hetu:    180px;
      --hero-gua:     120px;
      --gutter:       1rem;
      --gap-stack:    1.25rem;
      --font-label:   0.65rem;
      --font-title:   1rem;
      --font-yao:     1.25rem;
      --font-cycle:   0.8rem;
      --touch-min:    44px;
    }

    /* Tablet 768+ */
    @media (min-width: 768px) {
      :root {
        --stage-max:    560px;
        --hero-size:    320px;
        --hero-hetu:    220px;
        --hero-gua:     150px;
        --gap-stack:    1.75rem;
        --font-title:   1.15rem;
        --font-yao:     1.5rem;
      }
    }

    /* Desktop 1024+ */
    @media (min-width: 1024px) {
      :root {
        --stage-max:    640px;
        --hero-size:    380px;
        --hero-hetu:    260px;
        --hero-gua:     180px;
        --gap-stack:    2.5rem;
        --font-title:   1.25rem;
        --font-yao:     1.65rem;
      }
    }

    /* =========================================
       Reset & Base
       ========================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;       /* dvh 让 mobile 浏览器地址栏动态高度友好 */
      display: flex; flex-direction: column;
      padding: var(--gutter);
      padding-top: max(env(safe-area-inset-top), var(--gutter));
      padding-bottom: max(env(safe-area-inset-bottom), var(--gutter));
    }

    /* =========================================
       Stage & Meta
       ========================================= */
    .stage {
      width: 100%;
      max-width: var(--stage-max);
      margin: auto;
      display: flex; flex-direction: column; align-items: center;
    }
    .meta { text-align: center; margin-bottom: 1.25rem; }
    .meta__label {
      display: block;
      font-family: var(--font-mono);
      font-size: var(--font-label);
      letter-spacing: 0.2em;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }
    .meta__title {
      font-family: var(--font-display);
      font-size: var(--font-title);
      color: var(--text);
      letter-spacing: 0.02em;
    }

    /* =========================================
       Hero · 视觉中心：河洛与主卦共享同一格
       ========================================= */
    .hero-transition {
      position: relative;
      display: grid;
      place-items: center;
      width: var(--hero-size);
      height: var(--hero-size);
      margin-bottom: 1.5rem;
    }
    .hero-transition__hetu,
    .hero-transition__gua {
      grid-area: 1 / 1;
      display: flex; align-items: center; justify-content: center;
    }
    .hero-transition__hetu img { width: var(--hero-hetu); height: var(--hero-hetu); }
    .hero-transition__gua svg { width: var(--hero-gua); height: calc(var(--hero-gua) * 1.4); }

    /* 河洛稳定状态 */
    .hero-transition__hetu {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1) rotate(0deg);
    }

    /* 主卦初始状态 */
    .hero-transition__gua {
      opacity: 0;
      transform: translate3d(0, 0, 0) scale(.3);
    }

    /* =========================================
       动画 1 · 河洛离场（1.8s · ease-in）
       ========================================= */
    @keyframes hetu-leave {
      0%   { opacity: 1;    transform: translate3d(0,0,0) scale(1)    rotate(0deg); }
      100% { opacity: 0;    transform: translate3d(0,0,0) scale(.05) rotate(220deg); }
    }
    .hero-transition--transition .hero-transition__hetu,
    .hero-transition--gua .hero-transition__hetu,
    .hero-transition--breathing .hero-transition__hetu {
      animation: hetu-leave 1.8s ease-in forwards;
    }
    /* 终态兜底，避免 forwards 在选择器断链后失效 */
    .hero-transition--gua .hero-transition__hetu,
    .hero-transition--breathing .hero-transition__hetu {
      opacity: 0;
      transform: translate3d(0,0,0) scale(.05) rotate(220deg);
    }

    /* =========================================
       动画 2 · 主卦入场（1.8s · smooth ease）
       ========================================= */
    @keyframes gua-materialize {
      0%   { opacity: 0;   transform: translate3d(0,0,0) scale(.3); }
      60%  { opacity: .65; transform: translate3d(0,0,0) scale(.92); }
      100% { opacity: 1;   transform: translate3d(0,0,0) scale(1); }
    }
    .hero-transition--gua .hero-transition__gua,
    .hero-transition--breathing .hero-transition__gua {
      animation: gua-materialize 1.8s cubic-bezier(.45, 0, .25, 1) forwards;
    }

    /* =========================================
       动画 3 · 今日爻呼吸（6.6s · 沉 → 聚 → 沉）
       ========================================= */
    @keyframes yao-breathing {
      0%   { opacity: 1;    transform: scale(1);    filter: brightness(1); }
      50%  { opacity: .65;  transform: scale(.94);  filter: brightness(.92); }
      100% { opacity: 1;    transform: scale(1);    filter: brightness(1); }
    }
    .hero-transition--breathing .gua rect.today-yao {
      transform-box: fill-box;
      transform-origin: center;
      animation: yao-breathing 6.6s cubic-bezier(.45, 0, .55, 1) infinite;
    }

    /* =========================================
       爻线样式（黑底配色）
       ========================================= */
    .gua-rect { transition: all 0.3s ease; fill: var(--yang); }
    .gua-rect--yin { fill: var(--yang-dim); }
    .gua-rect--today {
      fill: var(--gold) !important;
      filter: drop-shadow(0 0 6px var(--gold-glow));
    }

    /* =========================================
       卦下面的元数据
       ========================================= */
    .today {
      display: flex; flex-direction: column; align-items: center;
      gap: 0.25rem;
      margin-bottom: 1.5rem;
    }
    .today__label {
      font-family: var(--font-mono);
      font-size: var(--font-label);
      letter-spacing: 0.15em;
      color: var(--gold);
    }
    .today__name {
      font-family: var(--font-display);
      font-size: var(--font-yao);
      color: var(--text);
    }
    .today__cycle {
      font-family: var(--font-mono);
      font-size: var(--font-cycle);
      color: var(--text-muted);
    }

    /* =========================================
       控制条 — mobile 上 stack，desktop 上 inline
       ========================================= */
    .controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: auto;
    }
    @media (min-width: 480px) {
      .controls {
        flex-direction: row;
        justify-content: center;
        width: auto;
      }
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: var(--touch-min);
      min-width: var(--touch-min);
      padding: 0.6rem 1.2rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover { border-color: var(--gold); background: var(--bg); }
    .btn:active { transform: scale(0.97); }
    .btn--ghost { background: transparent; border-color: transparent; color: var(--text-muted); }
    .btn--ghost:hover { color: var(--text); background: var(--surface); }

    .footnote {
      margin-top: 1.5rem;
      font-family: var(--font-mono);
      font-size: 0.6rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-align: center;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    /* =========================================
       Reduced Motion：直达终态
       ========================================= */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* =========================================
       横屏手机：把 hero 收紧，避免竖向空白
       ========================================= */
    @media (max-height: 500px) and (orientation: landscape) {
      :root {
        --hero-size: 200px;
        --hero-hetu: 150px;
        --hero-gua: 110px;
        --gap-stack: 1rem;
      }
      body { justify-content: center; }
    }
  </style>
</head>

      <div class="hero-transition__gua" id="gua"></div>
    </div>

    <div class="today">
      <span class="today__label">TODAY</span>
      <span class="today__name">三爻</span>
      <span class="today__cycle">3 / 6</span>
    </div>

    <div class="controls">
      <button class="btn" onclick="replay()">重播入场动画</button>
      <button class="btn btn--ghost" onclick="toggleRM()">Reduced Motion</button>
    </div>

    <p class="footnote">LIORIN · HERO TRANSITION · 河洛 → 卦 → 今日爻</p>
  </div>

  <script>
    // =============================================
    // 卦象渲染：6 爻，第三爻（九三）为今日动爻
    // =============================================
    const HEX = { name: '大有', yaos: [
      { type: 'yang' },
      { type: 'yang' },
      { type: 'yang', today: true },
      { type: 'yin'  },
      { type: 'yang' },
      { type: 'yang' },
    ]};

    function renderHexagram() {
      const W = 120, H = 168;
      const lineH = 10, gap = 8;
      const totalH = HEX.yaos.length * (lineH + gap) - gap;
      const startY = (H - totalH) / 2;

      const lines = HEX.yaos.map((y, i) => {
        const yPos = startY + i * (lineH + gap);
        const todayCls = y.today ? ' gua-rect--today today-yao' : '';
        const todayAria = y.today ? ' aria-label="今日动爻"' : '';

        if (y.type === 'yang') {
          return `<rect class="gua-rect${todayCls}" x="10" y="${yPos}" width="100" height="${lineH}" rx="1"${todayAria}/>`;
        }
        const gapW = 16;
        const segW = (100 - gapW) / 2;
        return `
          <rect class="gua-rect gua-rect--yin${todayCls}" x="10" y="${yPos}" width="${segW}" height="${lineH}" rx="1"${todayAria}/>
          <rect class="gua-rect gua-rect--yin${todayCls}" x="${10 + segW + gapW}" y="${yPos}" width="${segW}" height="${lineH}" rx="1"/>`;
      }).join('');

      return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="卦象 ${HEX.name}">
        ${lines}
      </svg>`;
    }

    document.getElementById('gua').innerHTML = renderHexagram();

    // =============================================
    // 入场动画状态机
    // =============================================
    function startHeroTransition() {
      const root = document.getElementById('hero-transition');
      root.classList.remove(
        'hero-transition--hetu',
        'hero-transition--transition',
        'hero-transition--gua',
        'hero-transition--breathing'
      );
      void root.offsetWidth;
      root.classList.add('hero-transition--hetu');

      setTimeout(() => {
        root.classList.remove('hero-transition--hetu');
        root.classList.add('hero-transition--transition');
      }, 1000);

      setTimeout(() => {
        root.classList.remove('hero-transition--transition');
        root.classList.add('hero-transition--gua');
      }, 3000);

      setTimeout(() => {
        root.classList.remove('hero-transition--gua');
        root.classList.add('hero-transition--breathing');
      }, 4800);
    }

    function replay() { startHeroTransition(); }

    function toggleRM() {
      const root = document.getElementById('hero-transition');
      root.classList.remove(
        'hero-transition--hetu',
        'hero-transition--transition',
        'hero-transition--gua'
      );
      root.classList.add('hero-transition--breathing');
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startHeroTransition);
    } else {
      startHeroTransition();
    }
  </script>
</body>
</html>
