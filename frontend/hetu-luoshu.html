<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIORIN — 河圖洛書</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans SC', 'PingFang SC', 'Inter', sans-serif;
      background: #10100E;
      color: #F1EDE3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .container {
      width: 100%;
      max-width: 500px;
      padding: 20px;
    }
    h1 {
      font-size: 24px;
      font-weight: 500;
      text-align: center;
      margin-bottom: 30px;
      color: #F1EDE3;
      letter-spacing: 0.1em;
    }
    .hero {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      max-width: 400px;
      margin: 0 auto 40px;
    }
    svg {
      width: 100%;
      height: 100%;
    }
    .dot-yin {
      fill: #9B988F;
      transition: all 0.5s ease;
    }
    .dot-yang {
      fill: #F1EDE3;
      transition: all 0.5s ease;
    }
    .number-label {
      fill: #A34A3A;
      font-size: 8px;
      font-weight: 500;
      text-anchor: middle;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .number-label.visible {
      opacity: 1;
    }
    .ring {
      fill: none;
      stroke: #A34A3A;
      stroke-width: 0.5;
      opacity: 0.3;
    }
    .stage-indicator {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 30px;
    }
    .stage-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3A3A35;
      transition: all 0.3s ease;
    }
    .stage-dot.active {
      background: #A34A3A;
      transform: scale(1.2);
    }
    .stage-label {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #9B988F;
      letter-spacing: 0.1em;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
    .animating {
      animation: pulse 1s ease-in-out infinite;
    }
    .rotating {
      animation: rotate 20s linear infinite;
      transform-origin: 100px 100px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>河圖洛書</h1>
    <div class="hero">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- 同心圆环 -->
        <circle class="ring" cx="100" cy="100" r="90" opacity="0.2"/>
        <circle class="ring" cx="100" cy="100" r="70" opacity="0.3"/>
        <circle class="ring" cx="100" cy="100" r="50" opacity="0.4"/>
        <circle class="ring" cx="100" cy="100" r="30" opacity="0.5"/>
        
        <!-- 十字辅助线 -->
        <line x1="100" y1="10" x2="100" y2="190" stroke="#A34A3A" stroke-width="0.5" opacity="0.2"/>
        <line x1="10" y1="100" x2="190" y2="100" stroke="#A34A3A" stroke-width="0.5" opacity="0.2"/>
        
        <!-- 河图点阵 -->
        <g id="hetu-dots">
          <!-- 中心: 5白点 (十字形) -->
          <circle class="dot-yang" cx="100" cy="100" r="4"/>
          <circle class="dot-yang" cx="100" cy="85" r="3"/>
          <circle class="dot-yang" cx="100" cy="115" r="3"/>
          <circle class="dot-yang" cx="85" cy="100" r="3"/>
          <circle class="dot-yang" cx="115" cy="100" r="3"/>
          
          <!-- 北(上): 1白+6黑 -->
          <circle class="dot-yang" cx="100" cy="30" r="4"/>
          <circle class="dot-yin" cx="85" cy="40" r="3"/>
          <circle class="dot-yin" cx="115" cy="40" r="3"/>
          <circle class="dot-yin" cx="90" cy="50" r="3"/>
          <circle class="dot-yin" cx="110" cy="50" r="3"/>
          <circle class="dot-yin" cx="100" cy="55" r="3"/>
          
          <!-- 南(下): 2黑+7白 -->
          <circle class="dot-yin" cx="100" cy="170" r="3.5"/>
          <circle class="dot-yin" cx="100" cy="155" r="3"/>
          <circle class="dot-yang" cx="85" cy="160" r="3"/>
          <circle class="dot-yang" cx="115" cy="160" r="3"/>
          <circle class="dot-yang" cx="90" cy="170" r="3"/>
          <circle class="dot-yang" cx="110" cy="170" r="3"/>
          <circle class="dot-yang" cx="100" cy="175" r="3"/>
          
          <!-- 东(右): 3白+8白 -->
          <circle class="dot-yang" cx="170" cy="100" r="3.5"/>
          <circle class="dot-yang" cx="155" cy="100" r="3"/>
          <circle class="dot-yang" cx="160" cy="85" r="3"/>
          <circle class="dot-yang" cx="160" cy="115" r="3"/>
          <circle class="dot-yang" cx="170" cy="90" r="3"/>
          <circle class="dot-yang" cx="170" cy="110" r="3"/>
          <circle class="dot-yang" cx="175" cy="95" r="3"/>
          <circle class="dot-yang" cx="175" cy="105" r="3"/>
          
          <!-- 西(左): 4黑+9黑 -->
          <circle class="dot-yin" cx="30" cy="100" r="3.5"/>
          <circle class="dot-yin" cx="45" cy="100" r="3"/>
          <circle class="dot-yin" cx="40" cy="85" r="3"/>
          <circle class="dot-yin" cx="40" cy="115" r="3"/>
          <circle class="dot-yin" cx="30" cy="90" r="3"/>
          <circle class="dot-yin" cx="30" cy="110" r="3"/>
          <circle class="dot-yin" cx="25" cy="95" r="3"/>
          <circle class="dot-yin" cx="25" cy="105" r="3"/>
          <circle class="dot-yin" cx="35" cy="100" r="3"/>
          
          <!-- 数字标签 -->
          <text class="number-label" x="100" y="22">1</text>
          <text class="number-label" x="100" y="195">2</text>
          <text class="number-label" x="195" y="104">3</text>
          <text class="number-label" x="15" y="104">4</text>
          <text class="number-label" x="100" y="104">5</text>
          <text class="number-label" x="100" y="65">6</text>
          <text class="number-label" x="100" y="145">7</text>
          <text class="number-label" x="185" y="104">8</text>
          <text class="number-label" x="25" y="104">9</text>
        </g>
        
        <!-- 洛书九宫格 (初始隐藏) -->
        <g id="luoshu-grid" style="display:none;">
          <!-- 九宫格外框 -->
          <rect x="55" y="55" width="90" height="90" fill="none" stroke="#A34A3A" stroke-width="0.5" opacity="0.5"/>
          <line x1="85" y1="55" x2="85" y2="145" stroke="#A34A3A" stroke-width="0.5" opacity="0.3"/>
          <line x1="115" y1="55" x2="115" y2="145" stroke="#A34A3A" stroke-width="0.5" opacity="0.3"/>
          <line x1="55" y1="85" x2="145" y2="85" stroke="#A34A3A" stroke-width="0.5" opacity="0.3"/>
          <line x1="55" y1="115" x2="145" y2="115" stroke="#A34A3A" stroke-width="0.5" opacity="0.3"/>
          
          <!-- 洛书数字: 492/357/816 -->
          <text class="number-label" x="70" y="75">4</text>
          <text class="number-label" x="100" y="75">9</text>
          <text class="number-label" x="130" y="75">2</text>
          <text class="number-label" x="70" y="105">3</text>
          <text class="number-label" x="100" y="105">5</text>
          <text class="number-label" x="130" y="105">7</text>
          <text class="number-label" x="70" y="135">8</text>
          <text class="number-label" x="100" y="135">1</text>
          <text class="number-label" x="130" y="135">6</text>
        </g>
        
        <!-- 爻线 (初始隐藏) -->
        <g id="yao-lines" style="display:none;">
          <!-- 阳爻: 实线 -->
          <line x1="60" y1="50" x2="140" y2="50" stroke="#F1EDE3" stroke-width="4"/>
          <!-- 阴爻: 断线 -->
          <line x1="60" y1="70" x2="90" y2="70" stroke="#F1EDE3" stroke-width="4"/>
          <line x1="110" y1="70" x2="140" y2="70" stroke="#F1EDE3" stroke-width="4"/>
          <!-- 阳爻 -->
          <line x1="60" y1="90" x2="140" y2="90" stroke="#F1EDE3" stroke-width="4"/>
          <!-- 阴爻 -->
          <line x1="60" y1="110" x2="90" y2="110" stroke="#F1EDE3" stroke-width="4"/>
          <line x1="110" y1="110" x2="140" y2="110" stroke="#F1EDE3" stroke-width="4"/>
          <!-- 阳爻 -->
          <line x1="60" y1="130" x2="140" y2="130" stroke="#F1EDE3" stroke-width="4"/>
          <!-- 阳爻 -->
          <line x1="60" y1="150" x2="140" y2="150" stroke="#F1EDE3" stroke-width="4"/>
        </g>
        
        <!-- 卦象 (乾卦 ☰) (初始隐藏) -->
        <g id="hexagram" style="display:none;">
          <g transform="translate(100, 100) scale(1.5)">
            <line x1="-30" y1="-40" x2="30" y2="-40" stroke="#F1EDE3" stroke-width="3"/>
            <line x1="-30" y1="-25" x2="30" y2="-25" stroke="#F1EDE3" stroke-width="3"/>
            <line x1="-30" y1="-10" x2="30" y2="-10" stroke="#F1EDE3" stroke-width="3"/>
            <line x1="-30" y1="5" x2="30" y2="5" stroke="#F1EDE3" stroke-width="3"/>
            <line x1="-30" y1="20" x2="30" y2="20" stroke="#F1EDE3" stroke-width="3"/>
            <line x1="-30" y1="35" x2="30" y2="35" stroke="#F1EDE3" stroke-width="3"/>
          </g>
        </g>
      </svg>
    </div>
    
    <div class="stage-indicator">
      <div class="stage-dot" data-stage="0"></div>
      <div class="stage-dot" data-stage="1"></div>
      <div class="stage-dot" data-stage="2"></div>
      <div class="stage-dot" data-stage="3"></div>
      <div class="stage-dot" data-stage="4"></div>
      <div class="stage-dot" data-stage="5"></div>
      <div class="stage-dot" data-stage="6"></div>
    </div>
    <div class="stage-label" id="stage-label">河圖</div>
  </div>
  
  <script>
    const stages = ['河圖', '洛書', '數流動', '數聚合', '成爻', '卦象', '今日之象'];
    let currentStage = 0;
    let animationTimer = null;
    
    function updateStage(stage) {
      currentStage = stage;
      
      // 更新指示器
      document.querySelectorAll('.stage-dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === stage);
      });
      
      // 更新标签
      document.getElementById('stage-label').textContent = stages[stage];
      
      // 根据阶段更新SVG内容
      const hetuDots = document.getElementById('hetu-dots');
      const luoshuGrid = document.getElementById('luoshu-grid');
      const yaoLines = document.getElementById('yao-lines');
      const hexagram = document.getElementById('hexagram');
      
      switch(stage) {
        case 0: // 河圖
          hetuDots.style.display = 'block';
          luoshuGrid.style.display = 'none';
          yaoLines.style.display = 'none';
          hexagram.style.display = 'none';
          break;
        case 1: // 洛書
          hetuDots.style.display = 'none';
          luoshuGrid.style.display = 'block';
          yaoLines.style.display = 'none';
          hexagram.style.display = 'none';
          break;
        case 2: // 數流動
          hetuDots.style.display = 'block';
          luoshuGrid.style.display = 'none';
          yaoLines.style.display = 'none';
          hexagram.style.display = 'none';
          hetuDots.classList.add('animating');
          break;
        case 3: // 數聚合
          hetuDots.style.display = 'block';
          luoshuGrid.style.display = 'none';
          yaoLines.style.display = 'none';
          hexagram.style.display = 'none';
          hetuDots.classList.remove('animating');
          break;
        case 4: // 成爻
          hetuDots.style.display = 'none';
          luoshuGrid.style.display = 'none';
          yaoLines.style.display = 'block';
          hexagram.style.display = 'none';
          break;
        case 5: // 卦象
          hetuDots.style.display = 'none';
          luoshuGrid.style.display = 'none';
          yaoLines.style.display = 'none';
          hexagram.style.display = 'block';
          break;
        case 6: // 今日之象
          hetuDots.style.display = 'none';
          luoshuGrid.style.display = 'none';
          yaoLines.style.display = 'none';
          hexagram.style.display = 'block';
          break;
      }
      
      // 显示数字标签
      if (stage >= 1) {
        document.querySelectorAll('.number-label').forEach(label => {
          label.classList.add('visible');
        });
      }
    }
    
    function playAnimation() {
      updateStage(0);
      
      const stageTimings = [1000, 1000, 900, 900, 900, 700, 1000];
      let delay = 0;
      
      stages.forEach((_, i) => {
        setTimeout(() => {
          updateStage(i);
          if (i === stages.length - 1) {
            // 动画完成，重置
            setTimeout(() => {
              playAnimation();
            }, 2000);
          }
        }, delay);
        delay += stageTimings[i];
      });
    }
    
    // 点击切换阶段
    document.querySelectorAll('.stage-dot').forEach(dot => {
      dot.addEventListener('click', () => {
        const stage = parseInt(dot.dataset.stage);
        updateStage(stage);
      });
    });
    
    // 页面加载后开始动画
    window.addEventListener('load', () => {
      playAnimation();
    });
  </script>
</body>
</html>
