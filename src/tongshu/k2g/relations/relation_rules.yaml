# K2G Relation Rules — 关系融合规则集
# Generated: 2026-08-25
# Total: 36 rules covering 9 relation types

schema_version: "1.0.0"
generated_at: "2026-08-25"
total_rules: 36

rules:
  # ===== SUPPORT (正向支持) =====
  - relation_id: REL_SUP_001
    relation_type: SUPPORT
    description: 主动性+时机成熟=强力支持
    inputs:
      - semantic_id: SEM_XING_001
        label: 主动性
      - semantic_id: SEM_SHI_T_001
        label: 时机成熟
    output:
      label: 行动成功概率大幅提升
      weight: 0.85
    conditions:
      - "SEM_XING_001置信度>=0.6"
      - "SEM_SHI_T_001置信度>=0.6"
    fallback:
      strategy: "降级为单信号评估"
      action: "取置信度较高的单信号输出"
      weight: 0.5

  - relation_id: REL_SUP_002
    relation_type: SUPPORT
    description: 合作型+沟通型=合作顺畅
    inputs:
      - semantic_id: SEM_REN_001
        label: 合作型
      - semantic_id: SEM_REN_005
        label: 沟通型
    output:
      label: 合作成功率大幅提升
      weight: 0.8
    conditions:
      - "SEM_REN_001置信度>=0.5"
      - "SEM_REN_005置信度>=0.5"
    fallback:
      strategy: "降级为合作型单独评估"
      action: "输出合作意愿但提示沟通风险"
      weight: 0.55

  - relation_id: REL_SUP_003
    relation_type: SUPPORT
    description: 学习期+耐心性=学习效果持久
    inputs:
      - semantic_id: SEM_SHI_010
        label: 学习期
      - semantic_id: SEM_XING_005
        label: 耐心性
    output:
      label: 学习深度与持久性双提升
      weight: 0.75
    conditions:
      - "SEM_SHI_010置信度>=0.5"
      - "SEM_XING_005置信度>=0.5"
    fallback:
      strategy: "降级为学习期单独评估"
      action: "输出学习建议但提示坚持难度"
      weight: 0.5

  - relation_id: REL_SUP_004
    relation_type: SUPPORT
    description: 养生型+作息型=健康养护全面
    inputs:
      - semantic_id: SEM_YANG_001
        label: 养生型
      - semantic_id: SEM_YANG_006
        label: 作息型
    output:
      label: 健康效果全面提升
      weight: 0.8
    conditions:
      - "SEM_YANG_001置信度>=0.5"
      - "SEM_YANG_006置信度>=0.5"
      - "无医疗紧急情况"
    fallback:
      strategy: "降级为作息型单独评估"
      action: "输出作息建议作为健康基础"
      weight: 0.55

  - relation_id: REL_SUP_005
    relation_type: SUPPORT
    description: 上升期+展示期=事业曝光倍增
    inputs:
      - semantic_id: SEM_SHI_002
        label: 上升期
      - semantic_id: SEM_SHI_011
        label: 展示期
    output:
      label: 事业影响力快速扩大
      weight: 0.85
    conditions:
      - "SEM_SHI_002置信度>=0.6"
      - "SEM_SHI_011置信度>=0.5"
    fallback:
      strategy: "降级为上升期单独评估"
      action: "输出上升趋势但提示展示时机"
      weight: 0.6

  # ===== CONTRADICT (直接矛盾) =====
  - relation_id: REL_CON_001
    relation_type: CONTRADICT
    description: 主动性vs审慎性-风险场景决策
    inputs:
      - semantic_id: SEM_XING_001
        label: 主动性
      - semantic_id: SEM_XING_004
        label: 审慎性
    output:
      label: 视风险等级决策
      rule: "高风险取审慎性，低风险取主动性，中等风险先审慎后主动"
      weight: 0.5
    conditions:
      - "两者置信度均>=0.5"
      - "需评估场景风险等级"
    fallback:
      strategy: "保守优先原则"
      action: "默认取审慎性输出安全建议"
      weight: 0.4

  - relation_id: REL_CON_002
    relation_type: CONTRADICT
    description: 时机成熟vs时机未到-保守决策
    inputs:
      - semantic_id: SEM_SHI_T_001
        label: 时机成熟
      - semantic_id: SEM_SHI_T_002
        label: 时机未到
    output:
      label: 取置信度高者，相近取时机未到
      rule: "保守原则：避免冒进"
      weight: 0.5
    conditions:
      - "两者置信度均>=0.4"
    fallback:
      strategy: "等待观望"
      action: "建议用户继续观察，暂不决策"
      weight: 0.3

  - relation_id: REL_CON_003
    relation_type: CONTRADICT
    description: 扩张期vs收缩期-安全优先
    inputs:
      - semantic_id: SEM_SHI_013
        label: 扩张期
      - semantic_id: SEM_SHI_014
        label: 收缩期
    output:
      label: 取置信度高者，相近取收缩期
      rule: "安全原则：避免盲目扩张"
      weight: 0.5
    conditions:
      - "两者置信度均>=0.4"
    fallback:
      strategy: "聚焦核心"
      action: "建议收缩非核心业务，集中资源"
      weight: 0.4

  - relation_id: REL_CON_004
    relation_type: CONTRADICT
    description: 社交型vs独处型-场景适配
    inputs:
      - semantic_id: SEM_REN_010
        label: 社交型
      - semantic_id: SEM_REN_006
        label: 独处型
    output:
      label: 视场景选择
      rule: "工作社交取社交型，创作休息取独处型"
      weight: 0.5
    conditions:
      - "两者置信度均>=0.5"
      - "需识别当前场景类型"
    fallback:
      strategy: "平衡策略"
      action: "建议交替进行社交与独处"
      weight: 0.45

  # ===== QUALIFY (限定修饰) =====
  - relation_id: REL_QLF_001
    relation_type: QUALIFY
    description: 主动性受审慎性限定
    inputs:
      - semantic_id: SEM_XING_001
        label: 主动性
      - semantic_id: SEM_XING_004
        label: 审慎性
    output:
      label: 审慎评估后主动行动
      rule: "先审慎评估，后主动行动"
      weight: 0.6
    conditions:
      - "SEM_XING_004置信度>=0.6"
    fallback:
      strategy: "仅输出审慎建议"
      action: "不推荐行动，需完善风险评估"
      weight: 0.3

  - relation_id: REL_QLF_002
    relation_type: QUALIFY
    description: 合作型受边界型限定
    inputs:
      - semantic_id: SEM_REN_001
        label: 合作型
      - semantic_id: SEM_REN_008
        label: 边界型
    output:
      label: 边界内开展合作
      rule: "先明确边界，后开展合作"
      weight: 0.6
    conditions:
      - "SEM_REN_008置信度>=0.5"
    fallback:
      strategy: "谨慎合作"
      action: "建议先建立信任再深化合作"
      weight: 0.4

  - relation_id: REL_QLF_003
    relation_type: QUALIFY
    description: 养生型受医疗边界限定
    inputs:
      - semantic_id: SEM_YANG_001
        label: 养生型
      - semantic_id: SAFETY_MEDICAL
        label: 医疗边界
    output:
      label: 健康养护范围内养生
      rule: "养生不能替代医疗"
      weight: 0.5
    conditions:
      - "无确诊疾病或医疗需求"
    fallback:
      strategy: "医疗优先"
      action: "建议就医而非仅养生调理"
      weight: 0.7

  - relation_id: REL_QLF_004
    relation_type: QUALIFY
    description: 机遇期受风险边界限定
    inputs:
      - semantic_id: SEM_SHI_015
        label: 机遇期
      - semantic_id: SAFETY_RISK
        label: 投资风险边界
    output:
      label: 风险承受内把握机遇
      rule: "机遇不能替代风险评估"
      weight: 0.5
    conditions:
      - "SEM_SHI_015置信度>=0.5"
      - "风险承受能力可评估"
    fallback:
      strategy: "保守理财"
      action: "建议低风险理财而非高风险投资"
      weight: 0.4

  # ===== AMPLIFY (放大效应) =====
  - relation_id: REL_AMP_001
    relation_type: AMPLIFY
    description: 时机成熟放大主动性效果
    inputs:
      - semantic_id: SEM_SHI_T_001
        label: 时机成熟
      - semantic_id: SEM_XING_001
        label: 主动性
    output:
      label: 行动成功率倍增
      rule: "天时地利人和，事半功倍"
      weight: 0.9
    conditions:
      - "SEM_SHI_T_001置信度>=0.7"
      - "SEM_XING_001置信度>=0.6"
    fallback:
      strategy: "基础行动评估"
      action: "按单信号评估输出基础建议"
      weight: 0.55

  - relation_id: REL_AMP_002
    relation_type: AMPLIFY
    description: 上升期放大展示期效果
    inputs:
      - semantic_id: SEM_SHI_002
        label: 上升期
      - semantic_id: SEM_SHI_011
        label: 展示期
    output:
      label: 影响力快速扩大
      rule: "乘势而上，影响力倍增"
      weight: 0.85
    conditions:
      - "SEM_SHI_002置信度>=0.7"
      - "SEM_SHI_011置信度>=0.6"
    fallback:
      strategy: "稳扎稳打"
      action: "建议巩固基础后再考虑展示"
      weight: 0.5

  - relation_id: REL_AMP_003
    relation_type: AMPLIFY
    description: 合作型放大机遇期效果
    inputs:
      - semantic_id: SEM_REN_001
        label: 合作型
      - semantic_id: SEM_SHI_015
        label: 机遇期
    output:
      label: 机遇倍增
      rule: "合作共赢，机遇倍增"
      weight: 0.85
    conditions:
      - "SEM_REN_001置信度>=0.6"
      - "SEM_SHI_015置信度>=0.6"
    fallback:
      strategy: "独立机遇评估"
      action: "输出机遇信息但不强调合作必要"
      weight: 0.55

  # ===== REDUCE (减弱效应) =====
  - relation_id: REL_RED_001
    relation_type: REDUCE
    description: 时机未到抑制主动性
    inputs:
      - semantic_id: SEM_SHI_T_002
        label: 时机未到
      - semantic_id: SEM_XING_001
        label: 主动性
    output:
      label: 宜藏不宜动
      rule: "时机未到，主动性应被抑制"
      weight: 0.3
    conditions:
      - "SEM_SHI_T_002置信度>=0.6"
    fallback:
      strategy: "积蓄等待"
      action: "建议等待时机而非强行行动"
      weight: 0.4

  - relation_id: REL_RED_002
    relation_type: REDUCE
    description: 边界型抑制合作型过度
    inputs:
      - semantic_id: SEM_REN_008
        label: 边界型
      - semantic_id: SEM_REN_001
        label: 合作型
    output:
      label: 合作要有边界
      rule: "防止无底线合作和被利用"
      weight: 0.4
    conditions:
      - "SEM_REN_008置信度>=0.6"
      - "合作过度迹象"
    fallback:
      strategy: "正常合作评估"
      action: "按合作型单独评估输出"
      weight: 0.6

  - relation_id: REL_RED_003
    relation_type: REDUCE
    description: 医疗边界抑制养生型过度
    inputs:
      - semantic_id: SAFETY_MEDICAL
        label: 医疗边界
      - semantic_id: SEM_YANG_001
        label: 养生型
    output:
      label: 养生不能替代医疗
      rule: "有病需就医"
      weight: 0.2
    conditions:
      - "存在医疗需求或确诊疾病"
    fallback:
      strategy: "医疗优先"
      action: "建议就医，养生仅为辅助"
      weight: 0.3

  # ===== COMPLEMENT (互补关系) =====
  - relation_id: REL_COM_001
    relation_type: COMPLEMENT
    description: 创新性+果断性=完整执行能力
    inputs:
      - semantic_id: SEM_XING_006
        label: 创新性
      - semantic_id: SEM_XING_003
        label: 果断性
    output:
      label: 创新可落地执行
      rule: "创新需要决断力落地"
      weight: 0.75
    conditions:
      - "SEM_XING_006置信度>=0.5"
      - "SEM_XING_003置信度>=0.5"
    fallback:
      strategy: "单项强化"
      action: "建议补充另一项特质"
      weight: 0.5

  - relation_id: REL_COM_002
    relation_type: COMPLEMENT
    description: 瓶颈期+耐心性=完整突破路径
    inputs:
      - semantic_id: SEM_SHI_006
        label: 瓶颈期
      - semantic_id: SEM_XING_005
        label: 耐心性
    output:
      label: 突破瓶颈有望
      rule: "耐心积累促成突破"
      weight: 0.7
    conditions:
      - "SEM_SHI_006置信度>=0.5"
      - "SEM_XING_005置信度>=0.5"
    fallback:
      strategy: "短期突破尝试"
      action: "建议小步快跑测试新方向"
      weight: 0.45

  - relation_id: REL_COM_003
    relation_type: COMPLEMENT
    description: 独处型+社交型=完整人际生态
    inputs:
      - semantic_id: SEM_REN_006
        label: 独处型
      - semantic_id: SEM_REN_010
        label: 社交型
    output:
      label: 人际生态平衡
      rule: "独处充电，社交拓展"
      weight: 0.7
    conditions:
      - "两者置信度均>=0.4"
    fallback:
      strategy: "当前主导模式"
      action: "按置信度较高者输出建议"
      weight: 0.55

  # ===== CONFLICT (冲突张力) =====
  - relation_id: REL_CONF_001
    relation_type: CONFLICT
    description: 主动性vs审慎性-需权衡决策
    inputs:
      - semantic_id: SEM_XING_001
        label: 主动性
      - semantic_id: SEM_XING_004
        label: 审慎性
    output:
      label: 需权衡后决策
      rule: "主动与审慎的张力"
      weight: 0.5
    conditions:
      - "两者置信度均>=0.6且接近"
    fallback:
      strategy: "分场景建议"
      action: "高风险场景建议审慎，低风险建议主动"
      weight: 0.45

  - relation_id: REL_CONF_002
    relation_type: CONFLICT
    description: 社交型vs独处型-需场景适配
    inputs:
      - semantic_id: SEM_REN_010
        label: 社交型
      - semantic_id: SEM_REN_006
        label: 独处型
    output:
      label: 需场景适配
      rule: "社交与独处的张力"
      weight: 0.5
    conditions:
      - "两者置信度均>=0.5且接近"
    fallback:
      strategy: "节奏建议"
      action: "建议保持社交与独处的交替节奏"
      weight: 0.5

  - relation_id: REL_CONF_003
    relation_type: CONFLICT
    description: 自信性vs谦逊性-需平衡
    inputs:
      - semantic_id: SEM_XING_011
        label: 自信性
      - semantic_id: SEM_XING_012
        label: 谦逊性
    output:
      label: 自信而谦逊
      rule: "自信是内在，谦逊是外在"
      weight: 0.6
    conditions:
      - "两者置信度均>=0.5"
    fallback:
      strategy: "情境区分"
      action: "正式场合谦逊，挑战场合自信"
      weight: 0.5

  # ===== SEQUENCE (时序先后) =====
  - relation_id: REL_SEQ_001
    relation_type: SEQUENCE
    description: 学习期→上升期
    inputs:
      - semantic_id: SEM_SHI_010
        label: 学习期
      - semantic_id: SEM_SHI_002
        label: 上升期
    output:
      label: 厚积薄发
      rule: "学习积累→上升发展"
      weight: 0.7
    conditions:
      - "SEM_SHI_010置信度>=0.6且早于SEM_SHI_002"
    fallback:
      strategy: "基础积累优先"
      action: "建议先完成学习积累再求上升"
      weight: 0.5

  - relation_id: REL_SEQ_002
    relation_type: SEQUENCE
    description: 创业期→稳定期→转型期
    inputs:
      - semantic_id: SEM_SHI_001
        label: 创业期
      - semantic_id: SEM_SHI_003
        label: 稳定期
      - semantic_id: SEM_SHI_004
        label: 转型期
    output:
      label: 三阶段递进
      rule: "创业开拓→稳定巩固→转型升级"
      weight: 0.75
    conditions:
      - "SEM_SHI_001置信度>=0.5"
      - "三阶段按序出现"
    fallback:
      strategy: "当前阶段专注"
      action: "建议专注当前阶段目标"
      weight: 0.55

  - relation_id: REL_SEQ_003
    relation_type: SEQUENCE
    description: 时机未到→时机成熟→时机高峰
    inputs:
      - semantic_id: SEM_SHI_T_002
        label: 时机未到
      - semantic_id: SEM_SHI_T_001
        label: 时机成熟
      - semantic_id: SEM_SHI_T_005
        label: 时机高峰
    output:
      label: 三阶段时机
      rule: "等待积蓄→把握机遇→适时收敛"
      weight: 0.8
    conditions:
      - "SEM_SHI_T_002置信度>=0.5且早于SEM_SHI_T_001"
    fallback:
      strategy: "当前时机建议"
      action: "根据当前所处阶段给出建议"
      weight: 0.6

  - relation_id: REL_SEQ_004
    relation_type: SEQUENCE
    description: 疲劳型→调理型→养生型
    inputs:
      - semantic_id: SEM_YANG_002
        label: 疲劳型
      - semantic_id: SEM_YANG_003
        label: 调理型
      - semantic_id: SEM_YANG_001
        label: 养生型
    output:
      label: 健康恢复路径
      rule: "休息恢复→科学调理→日常养生"
      weight: 0.75
    conditions:
      - "SEM_YANG_002置信度>=0.5且早于SEM_YANG_003"
    fallback:
      strategy: "当前状态建议"
      action: "根据当前状态给出恢复建议"
      weight: 0.55

  # ===== CONDITION (条件依赖) =====
  - relation_id: REL_COND_001
    relation_type: CONDITION
    description: 主动性发挥条件
    inputs:
      - semantic_id: SEM_XING_001
        label: 主动性
    output:
      label: 条件满足时主动行动
      rule: "时机成熟OR能力匹配OR风险可控"
      weight: 0.7
    conditions:
      - "时机成熟条件满足"
      - "或能力匹配条件满足"
      - "或风险可控条件满足"
    fallback:
      strategy: "抑制主动性"
      action: "建议等待或先提升能力/评估风险"
      weight: 0.3

  - relation_id: REL_COND_002
    relation_type: CONDITION
    description: 合作型发挥条件
    inputs:
      - semantic_id: SEM_REN_001
        label: 合作型
    output:
      label: 条件满足时积极合作
      rule: "边界明确OR信任建立OR利益一致"
      weight: 0.7
    conditions:
      - "边界明确条件满足"
      - "或信任建立条件满足"
      - "或利益一致条件满足"
    fallback:
      strategy: "谨慎考察"
      action: "建议先建立信任或明确边界再合作"
      weight: 0.4

  - relation_id: REL_COND_003
    relation_type: CONDITION
    description: 投资型发挥条件
    inputs:
      - semantic_id: SEM_SHI_015
        label: 机遇期
    output:
      label: 条件满足时可投资
      rule: "风险承受足够OR闲钱投资OR分散投资"
      weight: 0.65
    conditions:
      - "风险承受能力足够"
      - "或闲钱投资"
      - "或分散投资"
    fallback:
      strategy: "保守理财"
      action: "建议低风险理财方式"
      weight: 0.3

  - relation_id: REL_COND_004
    relation_type: CONDITION
    description: 理性性发挥条件
    inputs:
      - semantic_id: SEM_XING_009
        label: 理性性
