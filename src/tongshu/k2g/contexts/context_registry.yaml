# K2G Context Registry — 上下文注册表索引
# P7 Phase: 场景上下文注册表
# Version: 1.0.0
# Date: 2026-08-25

registry_version: 1.0.0
status: approved
total_contexts: 6

# ============================================================
# 六大主题 (Six Parent Themes)
# ============================================================
# XING  (行) - action/movement    行动、推进、出行
# SHI   (事) - career/work        工作、事务、事业
# REN   (人) - relationship       人际、情感、社交
# JU    (居) - home/stability     居家、环境、财务根基
# YANG  (养) - health/nurturing   健康、修养、内在滋养
# SHI_T (时) - timing             时间窗口、时机判断

themes:
  - id: XING
    name_cn: 行
    name_en: action/movement
    description: 行动、推进、出行相关场景
    contexts: []
    note: >
      XING 主题作为跨域流动性概念，其语义通过各上下文的
      TIMING/RHYTHM/ADAPTATION 等语义间接体现。
      如需专门行动上下文，可扩展 CTX_ACTION。

  - id: SHI
    name_cn: 事
    name_en: career/work
    description: 工作、事务、事业相关场景
    contexts:
      - CTX_CAREER

  - id: REN
    name_cn: 人
    name_en: relationship
    description: 人际、情感、社交相关场景
    contexts:
      - CTX_RELATIONSHIP
      - CTX_FAMILY

  - id: JU
    name_cn: 居
    name_en: home/stability
    description: 居家、环境、财务根基相关场景
    contexts:
      - CTX_FINANCE

  - id: YANG
    name_cn: 养
    name_en: health/nurturing
    description: 健康、修养、内在滋养相关场景
    contexts:
      - CTX_HEALTH

  - id: SHI_T
    name_cn: 时
    name_en: timing
    description: 时间窗口、时机判断相关场景
    contexts:
      - CTX_DAILY

# ============================================================
# 上下文列表
# ============================================================
contexts:
  - context_id: CTX_CAREER
    file: context_career.yaml
    parent_theme: SHI
    product_label: 事业与工作
    aliases: [work, career, professional]
    semantic_count:
      allowed: 10
      forbidden: 3

  - context_id: CTX_RELATIONSHIP
    file: context_relationship.yaml
    parent_theme: REN
    product_label: 关系与人际
    aliases: [relationship, social, interpersonal]
    semantic_count:
      allowed: 10
      forbidden: 3

  - context_id: CTX_HEALTH
    file: context_health.yaml
    parent_theme: YANG
    product_label: 健康与修养
    aliases: [health, wellness, nurturing, self-care]
    semantic_count:
      allowed: 10
      forbidden: 3

  - context_id: CTX_FINANCE
    file: context_finance.yaml
    parent_theme: JU
    product_label: 财务根基
    aliases: [finance, wealth, money, assets]
    semantic_count:
      allowed: 10
      forbidden: 3

  - context_id: CTX_FAMILY
    file: context_family.yaml
    parent_theme: REN
    product_label: 家庭关系
    aliases: [family, household, domestic]
    semantic_count:
      allowed: 10
      forbidden: 3

  - context_id: CTX_DAILY
    file: context_daily.yaml
    parent_theme: SHI_T
    product_label: 日常节律
    aliases: [daily, routine, timing, schedule]
    semantic_count:
      allowed: 10
      forbidden: 3

# ============================================================
# 产品标签 → parent_theme 映射
# ============================================================
product_to_theme_mapping:
  career: SHI
  work: SHI
  professional: SHI
  relationship: REN
  social: REN
  interpersonal: REN
  family: REN
  household: REN
  domestic: REN
  health: YANG
  wellness: YANG
  nurturing: YANG
  self-care: YANG
  finance: JU
  wealth: JU
  money: JU
  assets: JU
  daily: SHI_T
  routine: SHI_T
  timing: SHI_T
  schedule: SHI_T

# ============================================================
# 语义跨上下文引用统计
# ============================================================
cross_context_semantics:
  SEM_COMMUNICATION:
    contexts: [CTX_CAREER, CTX_RELATIONSHIP, CTX_FAMILY]
    note: 跨场景通用语义，在职场/人际/家庭中含义不同
  SEM_CAUTION:
    contexts: [CTX_CAREER, CTX_FINANCE]
    note: 风险意识在事业和财务中均有应用
  SEM_HARMONY:
    contexts: [CTX_RELATIONSHIP, CTX_FAMILY]
    note: 和谐在人际关系和家庭中都是核心目标
  SEM_TIMING:
    contexts: [CTX_CAREER, CTX_DAILY, CTX_FINANCE]
    note: 时机把握在多个场景都有应用
  SEM_BALANCE:
    contexts: [CTX_HEALTH, CTX_DAILY]
    note: 平衡在健康和日常节律中都很重要
